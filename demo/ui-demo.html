<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="data:,">
  <title>Document</title>
  <style>
  #main {
    height: 140px;
  }
  #pedal.on {
    background: #333;
    color: #fff;
  }
  </style>
</head>
<body>
  <div id="status">loading: 0 / 88</div>
  <div id="main"></div>
  <button id="pedal" style="margin-top:12px;padding:8px 16px;">Sustain Pedal: OFF</button>
  <script src="/ui.js"></script>
  <script>
  window.onload = () => {
    const ui = new window.PianoUI();
    const dom = document.getElementById('main');
    const statusDom = document.getElementById('status');
    const progressTimer = setInterval(() => {
      statusDom.textContent = `status: ${ui.piano.status}, loading: ${ui.piano.progress.loaded} / ${ui.piano.progress.total}`;
    }, 200);
    ui.render(dom);
    ui.initPiano().then(() => {
      clearInterval(progressTimer);
      statusDom.textContent = 'status: ready';
      ui.bindDomEvent(dom);
    }).catch(() => {
      clearInterval(progressTimer);
      statusDom.textContent = 'status: error';
    });

    const pedalDom = document.getElementById('pedal');
    let pedalOn = false;
    pedalDom.addEventListener('click', () => {
      pedalOn = !pedalOn;
      if (pedalOn) {
        ui.piano.pedalDown();
      } else {
        ui.piano.pedalUp();
      }
      pedalDom.classList.toggle('on', pedalOn);
      pedalDom.textContent = pedalOn ? 'Sustain Pedal: ON' : 'Sustain Pedal: OFF';
    });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        ui.piano.pedalDown();
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && !pedalOn) {
        ui.piano.pedalUp();
      }
    });
    window.ui = ui;
  }
  </script>
</body>
</html>
